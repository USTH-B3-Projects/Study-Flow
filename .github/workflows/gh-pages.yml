name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (for any build steps if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Copy Frontend assets to gh-pages ready structure
        run: |
          echo "Preparing assets for GitHub Pages deployment"
          # Create the directory structure
          mkdir -p gh-pages
          # Copy all Frontend assets
          cp -r Frontend/css gh-pages/
          cp -r Frontend/html gh-pages/
          cp -r Frontend/js gh-pages/
          cp Frontend/logo.png gh-pages/ 2>/dev/null || echo "logo.png not found in Frontend/"
          # Copy source assets (decorations, notes) from the root
          mkdir -p gh-pages/source
          cp -r source/studyflow-decoration-pack gh-pages/source/ 2>/dev/null || echo "source assets not found"
          cp -r source/studyflow-note gh-pages/source/ 2>/dev/null || echo "source notes not found"
          # The logo is in the repo root, not in Frontend/
          cp logo.png gh-pages/ 2>/dev/null || echo "logo.png not found in repo root"

      - name: Build with npm (if there are any build steps)
        run: |
          # This would run if there were build steps
          echo "Building for production..."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4