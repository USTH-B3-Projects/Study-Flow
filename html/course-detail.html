<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Course Detail - StudyFlow</title>
    <script>document.documentElement.dataset.theme=localStorage.getItem("studyflow_theme")||"light";</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/ui/light_dark.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/course.css" />
  </head>
  <body data-page="course-detail">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="dashboard.html"><img class="brand-logo" src="../logo.png" alt="StudyFlow" /></a>
        <nav class="nav nav-links"><a href="dashboard.html">Dashboard</a><a class="active" href="course.html">Courses</a><a href="tasks.html">All Tasks</a></nav>
        <div class="nav-actions user-actions">
          <label class="theme-switch" title="Switch to dark mode">
            <input id="themeToggle" type="checkbox" class="theme-switch__checkbox" aria-label="Switch to dark mode">
            <div class="theme-switch__container">
              <div class="theme-switch__clouds"></div>
              <div class="theme-switch__stars-container" aria-hidden="true">
                <svg viewBox="0 0 144 55" fill="currentColor"><circle cx="12" cy="36" r="3"/><circle cx="36" cy="20" r="2"/><circle cx="62" cy="30" r="3"/><circle cx="88" cy="14" r="2"/><circle cx="112" cy="36" r="3"/><circle cx="136" cy="8" r="2"/></svg>
              </div>
              <div class="theme-switch__circle-container">
                <div class="theme-switch__sun-moon-container">
                  <div class="theme-switch__moon">
                    <div class="theme-switch__spot"></div><div class="theme-switch__spot"></div><div class="theme-switch__spot"></div>
                  </div>
                </div>
              </div>
            </div>
          </label>
          <span id="userAvatar" class="user-avatar" aria-hidden="true"></span><span id="userName" class="user-name"></span><button id="logoutBtn" class="btn btn-outline">Log out</button>
        </div>
      </div>
    </header>
    <main class="container course-main page-enter">
      <a class="back-link" href="course.html">&larr; My courses</a>
      <section id="courseHero"></section>
      <section id="courseStats" class="course-stats"></section>
      <section id="warningArea"></section>
      <section class="task-toolbar">
        <div id="filters" class="filters"></div>
        <div class="toolbar-actions"><select id="sortSelect" class="select"><option value="priority">Sort: Priority</option><option value="deadline">Sort: Deadline</option><option value="importance">Sort: Importance</option><option value="createdAt">Sort: Created</option></select><button id="addTaskBtn" class="btn btn-primary">+ Add task</button></div>
      </section>
      <section id="taskList" class="task-list"></section>
    </main>
    <div id="modalRoot"></div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
