<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Course - StudyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/course.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body data-page="course">
    <header class="site-header">
      <div
        class="container"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <a class="brand" href="dashboard.html"
          ><i class="brand-mark"></i>Study<span>Flow</span></a
        >
        <nav class="nav nav-links"><a href="dashboard.html">Dashboard</a></nav>
        <div class="nav-actions">
          <span id="userName" class="muted" style="font-weight: 700"></span
          ><button id="logoutBtn" class="btn btn-outline">Log out</button>
        </div>
      </div>
    </header>
    <main class="container course-main page-enter">
      <a class="back-link" href="dashboard.html">? Back to dashboard</a>
      <section id="courseHero"></section>
      <section id="courseStats" class="course-stats"></section>
      <section class="task-toolbar">
        <div id="filters" class="filters"></div>
        <div style="display: flex; gap: 9px">
          <select id="sortSelect" class="select" style="width: auto">
            <option value="priority">Sort: Priority</option>
            <option value="deadline">Sort: Deadline</option>
            <option value="importance">Sort: Importance</option>
            <option value="createdAt">Sort: Created</option></select
          ><button id="addTaskBtn" class="btn btn-primary">? Add task</button>
        </div>
      </section>
      <section id="taskList" class="task-list"></section>
    </main>
    <div id="modalRoot"></div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
