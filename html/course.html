<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Course - StudyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/course.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body data-page="course">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="dashboard.html"><img class="brand-logo" src="../logo.png" alt="StudyFlow" /></a>
            <nav class="nav nav-links"><a href="dashboard.html">Dashboard</a></nav>
            <div class="nav-actions user-actions">
                <span id="userAvatar" class="user-avatar" aria-hidden="true"></span>
                <span id="userName" class="user-name"></span>
                <button id="logoutBtn" class="btn btn-outline">Log out</button>
            </div>
        </div>
    </header>
    <main class="container course-main page-enter">
        <a class="back-link" href="dashboard.html">&larr; My courses</a>
        <section id="courseHero"></section>
        <section id="courseStats" class="course-stats"></section>
        <section class="task-toolbar">
            <div id="filters" class="filters"></div>
            <div class="toolbar-actions">
                <select id="sortSelect" class="select">
                    <option value="priority">Sort: Priority</option>
                    <option value="deadline">Sort: Deadline</option>
                    <option value="importance">Sort: Importance</option>
                    <option value="createdAt">Sort: Created</option>
                </select><button id="addTaskBtn" class="btn btn-primary"><span aria-hidden="true">+</span> Add
                    task</button>
            </div>
        </section>
        <section id="taskList" class="task-list"></section>
    </main>
    <div id="modalRoot"></div>
    <script type="module" src="../js/app.js"></script>
</body>

</html>
