<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard - StudyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body data-page="dashboard">
    <header class="site-header">
      <div
        class="container"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <a class="brand" href="dashboard.html"
          ><i class="brand-mark"></i>Study<span>Flow</span></a
        >
        <nav class="nav nav-links">
          <a class="active" href="dashboard.html">Dashboard</a>
        </nav>
        <div class="nav-actions">
          <span id="userName" class="muted" style="font-weight: 700"></span
          ><button id="logoutBtn" class="btn btn-outline">Log out</button>
        </div>
      </div>
    </header>
    <main class="container dashboard-main page-enter">
      <section class="dash-head">
        <div>
          <div class="eyebrow">Your study overview</div>
          <h1 id="greeting">Good morning</h1>
          <p>Stay focused on the next useful step.</p>
        </div>
        <div class="action-row">
          <button id="addCourseBtn" class="btn btn-outline">+ Add course</button
          ><button id="recommendBtn" class="btn btn-primary">
            What should I do next?
          </button>
        </div>
      </section>
      <section class="stats-grid" id="stats"></section>
      <section id="warningArea"></section>
      <div class="section-head"><h2>My courses</h2></div>
      <section id="courseGrid" class="course-grid"></section>
    </main>
    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <aside id="recommendDrawer" class="drawer">
      <div class="drawer-head">
        <div>
          <div class="eyebrow">Smart recommendation</div>
          <h2>What should I do next?</h2>
          <p class="muted">Tasks ranked across all your courses.</p>
        </div>
        <button id="closeDrawer" class="icon-btn">x</button>
      </div>
      <div id="recommendList" class="recommend-list"></div>
    </aside>
    <div id="modalRoot"></div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
