<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register - StudyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body data-page="auth">
    <header class="site-header">
      <div
        class="container"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <a class="brand" href="index.html"
          ><i class="brand-mark"></i>Study<span>Flow</span></a
        ><a class="btn btn-outline" href="login.html">Log in</a>
      </div>
    </header>
    <main class="container page-enter">
      <section class="auth-shell">
        <div class="auth-copy">
          <div class="eyebrow">Start with a clear plan</div>
          <h1>Make study time <strong>count.</strong></h1>
          <p>
            Create your workspace and turn deadlines into a plan you can trust.
          </p>
        </div>
        <div class="card auth-panel">
          <div class="tabs">
            <a class="tab" href="login.html">Log in</a
            ><a class="tab active" href="register.html">Register</a>
          </div>
          <form id="registerForm" class="auth-form">
            <h2>Create account</h2>
            <div class="form-field">
              <label for="name">Name</label
              ><input
                class="input"
                id="name"
                name="name"
                required
                placeholder="Your name"
              />
            </div>
            <div class="form-field">
              <label for="studentId">Student ID</label
              ><input
                class="input"
                id="studentId"
                name="studentId"
                required
                placeholder="e.g. 1023"
              />
            </div>
            <div class="form-field">
              <label for="email">Email</label
              ><input
                class="input"
                id="email"
                name="email"
                type="email"
                required
                placeholder="you@example.com"
              />
            </div>
            <div class="form-field">
              <label for="password">Password</label
              ><input
                class="input"
                id="password"
                name="password"
                type="password"
                minlength="6"
                required
                placeholder="At least 6 characters"
              />
            </div>
            <div class="form-error" id="formError" role="alert"></div>
            <button class="btn btn-primary" type="submit">
              Create account
            </button>
            <div class="auth-foot">
              Already have an account? <a href="login.html">Log in</a>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
